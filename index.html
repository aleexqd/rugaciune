<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pravila Bogorodișnaia</title>
    <style>
        /* Stiluri generale pentru o temă sobră și confortabilă */
        body {
            background-color: #1e1e1e; /* Fundal închis la culoare, odihnitor */
            color: #e0e0e0; /* Text gri deschis, contrast blând */
            font-family: 'Georgia', serif; /* Font elegant, potrivit pentru texte religioase */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            -webkit-user-select: none; /* Previne selectarea textului pe mobil la tap rapid */
            user-select: none;
        }

        /* Containerul principal al rugăciunii */
        .prayer-container {
            max-width: 600px;
            width: 100%;
            background-color: #262626;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #3d3d3d;
            box-sizing: border-box;
        }

        /* Imaginea din PC - Setată la 150x150px, discretă și aliniată */
        .custom-cross-image {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin: 0 auto 25px auto;
            display: block;
            opacity: 0.75; /* Opacitate discretă pentru a nu obosi ochii */
        }

        /* Stilul textului rugăciunii */
        .prayer-text {
            font-size: 1.35rem;
            line-height: 1.7;
            margin-bottom: 40px;
            color: #f5f5f5;
        }

        /* Zona de navigație cu săgeți */
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 240px;
            margin: 0 auto;
        }

        /* Săgețile stânga/dreapta - Modificate pentru un efect vizual discret */
        .arrow {
            font-size: 2.5rem; 
            color: #cccccc; /* Culoare de bază stabilă, alb-gri */
            cursor: pointer;
            background: none;
            border: none;
            padding: 15px 25px; 
            touch-action: manipulation; 
            transition: color 0.1s ease;
        }

        /* La apăsare pe ecran devine mai puțin vizibilă (gri închis) */
        .arrow:active {
            color: #555555; 
        }

        .arrow:disabled {
            color: #444;
            cursor: not-allowed;
        }

        /* Stilul numărului paginii */
        .page-counter {
            font-size: 1.1rem;
            color: #a0a0a0;
            margin-top: 20px;
            font-family: sans-serif;
        }

        /* Bara de progres subțire (Stil YouTube) */
        .progress-bar-container {
            width: 100%;
            height: 3px;
            background-color: #333333;
            margin-top: 15px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0.66%; /* Valoarea inițială pentru 1/150 */
            background-color: #1a4570; /* Albastru închis */
            transition: width 0.2s ease-in-out;
        }

        /* Ecranul final cu icoana */
        .final-screen {
            display: none;
        }

        .icon-image {
            max-width: 100%;
            height: auto;
            max-height: 450px;
            border-radius: 4px;
            border: 2px solid #d4af37;
            margin-bottom: 20px;
        }

        .final-text {
            font-size: 1.5rem;
            color: #d4af37;
            margin-top: 15px;
        }

        /* Buton de resetare la final */
        .reset-btn {
            background-color: #333;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            margin-top: 20px;
            font-size: 1rem;
            touch-action: manipulation;
        }
        
        .reset-btn:hover {
            background-color: #d4af37;
            color: #262626;
        }

        /* Ajustări specifice pentru ecrane de telefon mobil */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .prayer-container {
                padding: 30px 15px;
            }

            .custom-cross-image {
                width: 110px; /* Se adaptează ușor pentru ecranele înguste de telefon */
                height: 110px;
                margin-bottom: 20px;
            }

            .prayer-text {
                font-size: 1.15rem; 
                line-height: 1.6;
                margin-bottom: 30px;
            }

            .arrow {
                font-size: 2.2rem;
                padding: 10px 20px;
            }

            .page-counter {
                font-size: 1rem;
                margin-top: 15px;
            }

            .icon-image {
                max-height: 350px; 
            }
        }
    </style>
</head>
<body>

    <div class="prayer-container">
        <!-- Zona interactivă pentru cele 150 de pagini -->
        <div id="prayer-content">
            <!-- Imaginea încărcată de tine pe GitHub -->
            <img class="custom-cross-image" src="ICXCNIKA.png" alt="Sfânta Cruce">

            <div class="prayer-text">
                Născătoare de Dumnezeu, Fecioară, bucură-te! Ceea ce ești plină de har, Marie, Domnul este cu tine. Binecuvântată ești tu între femei și binecuvântat este rodul pântecelui tău, că ai născut pre Mântuitorul sufletelor noastre.
            </div>
            
            <div class="navigation">
                <button class="arrow" id="prev-btn" onclick="changePage(-1)">&lt;</button>
                <button class="arrow" id="next-btn" onclick="changePage(1)">&gt;</button>
            </div>
            
            <div class="page-counter" id="page-display">1 / 150</div>

            <!-- Zona barei de progres -->
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Ecranul final care apare după pagina 150 -->
        <div id="final-content" class="final-screen">
            <img class="icon-image" src="https://basilica.ro/wp-content/uploads/2015/08/cele-mai-vechi-icoane-ale-maicii.jpg" alt="Icoana Maicii Domnului">
            <div class="final-text">☦️</div>
            <button class="reset-btn" onclick="resetPrayer()">Începe din nou</button>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 150;

        const prayerContent = document.getElementById('prayer-content');
        const finalContent = document.getElementById('final-content');
        const pageDisplay = document.getElementById('page-display');
        const prevBtn = document.getElementById('prev-btn');
        const progressFill = document.getElementById('progress-fill');

        function updateProgress() {
            // Actualizează lățimea bării în funcție de numărul paginii
            const percentage = (currentPage / totalPages) * 100;
            progressFill.style.width = percentage + '%';
        }

        function changePage(direction) {
            currentPage += direction;

            if (currentPage === 1) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            if (currentPage > totalPages) {
                prayerContent.style.display = 'none';
                finalContent.style.display = 'block';
            } else {
                pageDisplay.textContent = currentPage + ' / ' + totalPages;
                updateProgress();
            }
        }

        function resetPrayer() {
            currentPage = 1;
            pageDisplay.textContent = '1 / 150';
            prevBtn.disabled = true;
            updateProgress();
            finalContent.style.display = 'none';
            prayerContent.style.display = 'block';
        }

        // Configurare inițială
        prevBtn.disabled = true;
        updateProgress();
    </script>

</body>
</html>
