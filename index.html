<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pravila Bogorodișnaia</title>
    <style>
        /* Stiluri generale pentru o temă sobră și confortabilă */
        body {
            background-color: #1e1e1e; /* Fundal închis la culoare, odihnitor */
            color: #e0e0e0; /* Text gri deschis, contrast blând */
            font-family: 'Georgia', serif; /* Font elegant, potrivit pentru texte religioase */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Containerul principal al rugăciunii */
        .prayer-container {
            max-width: 600px;
            width: 100%;
            background-color: #262626;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #3d3d3d;
        }

        /* Stilul textului rugăciunii */
        .prayer-text {
            font-size: 1.35rem;
            line-height: 1.7;
            margin-bottom: 40px;
            color: #f5f5f5;
        }

        /* Zona de navigație cu săgeți */
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 200px;
            margin: 0 auto;
        }

        /* Săgețile stânga/dreapta */
        .arrow {
            font-size: 2rem;
            color: #d4af37; /* Culoare aurie/chihlimbar stins */
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
            background: none;
            border: none;
            padding: 0 15px;
        }

        .arrow:hover {
            color: #fff;
        }

        .arrow:disabled {
            color: #444;
            cursor: not-allowed;
        }

        /* Stilul numărului paginii */
        .page-counter {
            font-size: 1.1rem;
            color: #a0a0a0;
            margin-top: 15px;
            font-family: sans-serif;
        }

        /* Ecranul final cu icoana */
        .final-screen {
            display: none;
        }

        .icon-image {
            max-width: 100%;
            height: auto;
            max-height: 450px;
            border-radius: 4px;
            border: 2px solid #d4af37;
            margin-bottom: 20px;
        }

        .final-text {
            font-size: 1.2rem;
            color: #d4af37;
            margin-top: 15px;
        }

        /* Buton de resetare la final */
        .reset-btn {
            background-color: #333;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            margin-top: 15px;
        }
        .reset-btn:hover {
            background-color: #d4af37;
            color: #262626;
        }
    </style>
</head>
<body>

    <div class="prayer-container">
        <!-- Zona interactivă pentru cele 150 de pagini -->
        <div id="prayer-content">
            <div class="prayer-text">
                Născătoare de Dumnezeu, Fecioară, bucură-te! Ceea ce ești plină de har, Marie, Domnul este cu tine. Binecuvântată ești tu între femei și binecuvântat este rodul pântecelui tău, că ai născut pre Mântuitorul sufletelor noastre.
            </div>
            
            <div class="navigation">
                <button class="arrow" id="prev-btn" onclick="changePage(-1)">&lt;</button>
                <button class="arrow" id="next-btn" onclick="changePage(1)">&gt;</button>
            </div>
            
            <div class="page-counter" id="page-display">1 / 150</div>
        </div>

        <!-- Ecranul final care apare după pagina 150 -->
        <div id="final-content" class="final-screen">
            <img class="icon-image" src="https://basilica.ro/wp-content/uploads/2015/08/cele-mai-vechi-icoane-ale-maicii.jpg" alt="Icoana Maicii Domnului">
            <div class="final-text">☦️</div>
            <button class="reset-btn" onclick="resetPrayer()">Începe din nou</button>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 150;

        const prayerContent = document.getElementById('prayer-content');
        const finalContent = document.getElementById('final-content');
        const pageDisplay = document.getElementById('page-display');
        const prevBtn = document.getElementById('prev-btn');

        function changePage(direction) {
            currentPage += direction;

            // Dezactivează săgeata stânga dacă suntem la prima pagină
            if (currentPage === 1) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            // Dacă trecem de pagina 150, afișăm icoana de sfârșit
            if (currentPage > totalPages) {
                prayerContent.style.display = 'none';
                finalContent.style.display = 'block';
            } else {
                // Actualizăm numărul paginii curente
                pageDisplay.textContent = currentPage + ' / ' + totalPages;
            }
        }

        function resetPrayer() {
            currentPage = 1;
            pageDisplay.textContent = '1 / 150';
            prevBtn.disabled = true;
            finalContent.style.display = 'none';
            prayerContent.style.display = 'block';
        }

        // Inițializare la prima încărcare
        prevBtn.disabled = true;
    </script>

</body>
</html>
