<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>☦️</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

img{
width:90px;
opacity:0;
transform:scale(.85);
filter:drop-shadow(0 0 0 gold);
animation:intro .9s forwards;
}

@keyframes intro{

0%{
opacity:0;
transform:scale(.85);
filter:drop-shadow(0 0 0 gold);
}

40%{
opacity:1;
transform:scale(1.03);
filter:drop-shadow(0 0 25px gold);
}

100%{
opacity:1;
transform:scale(1);
filter:drop-shadow(0 0 12px gold);
}

}
</style>
</head>

<body>

<img src="../pravila/ICXCNIKA.png">

<script>

setTimeout(function(){

window.location.href="../pravila/";

},1200);

</script>

</body>
</html>
